<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Student Management System</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login-box">
    <h2>National Public School</h2>
    <p class="register-link">Student Management</p>

    <form onsubmit="event.preventDefault(); login();">
      <input type="text" id="username" placeholder="Username" aria-label="Username" autocomplete="username" required>
      <input type="password" id="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required>
      <select id="role" aria-label="Role">
        <option value="admin">Admin</option>
        <option value="teacher">Teacher</option>
        <option value="student">Student</option>
      </select>
      <button type="submit">Login</button>
    </form>

    <p class="register-link">New user? <a href="register.html">Register</a></p>
  </main>
  <script src="auth.js"></script>
</body>
</html>
