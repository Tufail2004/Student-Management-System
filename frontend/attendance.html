<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attendance | SMS</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h2>SMS</h2>
      <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="dashboard.html#students">Students</a></li>
        <li class="active"><a href="attendance.html" aria-current="page">Attendance</a></li>
        <li><a href="results.html">Results</a></li>
        <li><button class="logout" onclick="logout()">Logout</button></li>
      </ul>
    </aside>
    <main class="main">
      <div class="topbar"><h1>Attendance</h1></div>
      <div class="toolbar">
        <label for="attendanceDate">Date</label>
        <input class="date-picker" type="date" id="attendanceDate">
        <button type="button" id="saveAttendance">Save Attendance</button>
      </div>
      <div class="summary" aria-live="polite">
        <span>Present: <strong id="presentCount">0</strong></span>
        <span>Absent: <strong id="absentCount">0</strong></span>
        <span>Total students: <strong id="studentCount">0</strong></span>
      </div>
      <p id="attendanceMessage" class="form-message" role="status" aria-live="polite"></p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Roll No</th><th>Course</th><th>Status</th></tr></thead>
          <tbody id="attendanceRows"></tbody>
        </table>
      </div>
    </main>
  </div>
  <script src="auth.js"></script>
  <script src="attendance.js"></script>
  <script>if (protectPage()) initAttendance();</script>
</body>
</html>
